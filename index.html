<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MENSWARE | Premium Men's Accessories</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--bg:#050505;--panel:#101010;--red:#b30000;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#191919,#050505 55%);color:#eee;font-family:Montserrat,sans-serif}nav{position:sticky;top:0;z-index:10;background:#080808ee;backdrop-filter:blur(14px);border-bottom:1px solid #3a0000;padding:16px 5%;display:flex;align-items:center;gap:24px}nav strong{font:900 1.3rem Orbitron;color:#d00000;letter-spacing:3px;margin-right:auto}nav a{color:#ddd;text-decoration:none}.cart{border:1px solid #550000;padding:9px 14px;border-radius:20px}.hero{text-align:center;padding:80px 20px 50px}.hero h1{font:900 clamp(2.5rem,7vw,5rem) Orbitron;margin:0;color:#b30000;letter-spacing:8px;text-shadow:0 0 30px #700000}.hero p{color:#bbb}.toolbar{display:flex;gap:10px;max-width:850px;margin:0 auto 30px;padding:0 20px;flex-wrap:wrap}.toolbar input,.toolbar select{flex:1;min-width:180px;background:#111;border:1px solid #4b0000;color:#fff;padding:13px;border-radius:10px}.grid{max-width:1200px;margin:auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}.card{background:linear-gradient(145deg,#151515,#090909);border:1px solid #420000;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:.25s}.card:hover{transform:translateY(-6px);border-color:#b30000;box-shadow:0 15px 40px #40000066}.card img{width:100%;height:230px;object-fit:contain;border-radius:12px;background:#181818}.card h3{font:700 1.05rem Orbitron;color:#ddd}.price{font-size:1.15rem;color:#e00000;font-weight:700}.actions{display:flex;gap:8px}.btn{border:0;border-radius:20px;padding:11px 15px;cursor:pointer;font-weight:700}.primary{background:#b30000;color:#fff}.secondary{background:#222;color:#fff}.state{text-align:center;color:#999;padding:50px}.account{display:flex;gap:8px;align-items:center}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:20;padding:20px}.modal.show{display:grid}.box{background:#111;border:1px solid #600000;border-radius:18px;padding:24px;max-width:430px;width:100%}.box input{width:100%;margin:7px 0;padding:12px;background:#080808;border:1px solid #333;color:#fff;border-radius:8px}.close{float:right;color:#d00;cursor:pointer}footer{text-align:center;padding:50px 20px;color:#777;border-top:1px solid #300000;margin-top:50px}@media(max-width:650px){nav{flex-wrap:wrap}.account{display:none}}
</style>
</head>
<body>
<nav><strong>MENSWARE</strong><a href="#products">Shop</a><a href="#about">About</a><a href="/checkout.html">Checkout</a><span id="account" class="account"></span><a class="cart" href="#cart" onclick="loadCart()"><i class="fa-solid fa-bag-shopping"></i> <span id="cartCount">0</span></a></nav>
<section class="hero"><h1>MENSWARE</h1><p>Premium accessories engineered for the modern man.</p></section>
<div class="toolbar"><input id="search" placeholder="Search products..." oninput="loadProducts()"><select id="category" onchange="loadProducts()"><option value="">All categories</option><option value="Watches">Watches</option><option value="Wallets">Wallets</option><option value="Belts">Belts</option><option value="Accessories">Accessories</option></select></div>
<main id="products" class="grid"><div class="state">Loading MENSWARE catalog…</div></main>
<section id="about" class="hero"><h2>BUILT WITH INTENT</h2><p>One storefront. One API. Products, accounts, carts and orders connected through the same application.</p></section>
<footer>MENSWARE · Premium Men's E-Commerce</footer>
<div id="modal" class="modal"><div class="box"><span class="close" onclick="closeModal()">✕</span><h2 id="modalTitle">Account</h2><div id="modalBody"></div></div></div>
<script>
const API=window.location.origin+'/api';
let state={products:[],user:null};
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function api(path,options={}){const r=await fetch(API+path,{credentials:'include',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Request failed');return d}
async function loadProducts(){const q=encodeURIComponent(document.getElementById('search').value.trim()),c=encodeURIComponent(document.getElementById('category').value);try{const d=await api('/products?q='+q+'&category='+c);state.products=d.products||[];renderProducts()}catch(e){document.getElementById('products').innerHTML='<div class="state">Catalog unavailable. Start the MENSWARE API and check /api/health.</div>'}}
function renderProducts(){const el=document.getElementById('products');if(!state.products.length){el.innerHTML='<div class="state">No products found.</div>';return}el.innerHTML=state.products.map(p=>{const v=p.variants?.find(x=>x.isActive&&x.stock>0);const price=v?.price??p.basePrice;return `<article class="card"><img src="${esc(p.images?.[0]||'https://via.placeholder.com/500x400/111/aaa?text=MENSWARE')}" alt="${esc(p.name)}"><h3>${esc(p.name)}</h3><div class="price">₹${Number(price).toLocaleString('en-IN')}</div><div class="actions"><button class="btn secondary" onclick="quick('${p._id}')">View</button><button class="btn primary" onclick="addToCart('${p._id}','${v?._id||''}')">Add to Bag</button></div></article>`}).join('')}
async function addToCart(productId,variantId){try{await api('/cart/items',{method:'POST',body:JSON.stringify({productId,variantId:variantId||null,quantity:1})});await loadCart();alert('Added to bag.')}catch(e){alert(e.message)}}
async function loadCart(){try{const d=await api('/cart');document.getElementById('cartCount').textContent=(d.cart?.items||[]).reduce((n,i)=>n+i.quantity,0)}catch(e){document.getElementById('cartCount').textContent='0'}}
async function quick(id){try{const d=await api('/products/'+id),p=d.product;document.getElementById('modalTitle').textContent=p.name;document.getElementById('modalBody').innerHTML=`<p>${esc(p.description||'Premium MENSWARE accessory.')}</p><p class="price">From ₹${Number(p.basePrice).toLocaleString('en-IN')}</p><button class="btn primary" onclick="addToCart('${p._id}','${p.variants?.find(v=>v.isActive&&v.stock>0)?._id||''}');closeModal()">Add to Bag</button>`;document.getElementById('modal').classList.add('show')}catch(e){alert(e.message)}}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function auth(){document.getElementById('modalTitle').textContent='MENSWARE Account';document.getElementById('modalBody').innerHTML=`<input id="aName" placeholder="Name"><input id="aEmail" type="email" placeholder="Email"><input id="aPassword" type="password" placeholder="Password (8+ characters)"><div class="actions"><button class="btn primary" onclick="register()">Register</button><button class="btn secondary" onclick="login()">Login</button></div>`;document.getElementById('modal').classList.add('show')}
async function register(){try{const d=await api('/auth/register',{method:'POST',body:JSON.stringify({name:aName.value,email:aEmail.value,password:aPassword.value})});state.user=d.user;closeModal();renderAccount()}catch(e){alert(e.message)}}
async function login(){try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({email:aEmail.value,password:aPassword.value})});state.user=d.user;closeModal();renderAccount();loadCart()}catch(e){alert(e.message)}}
async function logout(){await api('/auth/logout',{method:'POST'});state.user=null;renderAccount();loadCart()}
async function renderAccount(){const a=document.getElementById('account');try{const d=await api('/auth/me');state.user=d.user}catch{}a.innerHTML=state.user?`<button class="btn secondary" onclick="logout()">Logout</button>`:`<button class="btn primary" onclick="auth()">Account</button>`}
loadProducts();loadCart();renderAccount();
</script>
</body></html>
