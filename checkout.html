<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="MENSWARE secure checkout.">
  <title>MENSWARE | Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Montserrat&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#050505;color:#eee;font-family:Montserrat,sans-serif}.box{max-width:700px;margin:40px auto;padding:28px;background:#101010;border:1px solid #4b0000;border-radius:18px}h1{font:800 2rem Orbitron;color:#b30000}input,select,textarea,button{width:100%;padding:13px;margin:7px 0;box-sizing:border-box;border-radius:8px;border:1px solid #333;background:#090909;color:#fff}button{background:#b30000;border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #222}.total{font-size:1.2rem;font-weight:bold;margin:20px 0}.back{color:#b30000;text-decoration:none}@media(max-width:600px){.row{grid-template-columns:1fr}.box{margin:20px;padding:20px}}</style>
</head>
<body>
  <main class="box">
    <h1>MENSWARE CHECKOUT</h1>
    <section id="cart" aria-live="polite">Loading bag…</section>
    <form id="form">
      <input id="name" required autocomplete="name" placeholder="Full name">
      <input id="email" required type="email" autocomplete="email" placeholder="Email">
      <input id="phone" autocomplete="tel" placeholder="Phone">
      <textarea id="address" required autocomplete="street-address" placeholder="Address"></textarea>
      <div class="row"><input id="city" required autocomplete="address-level2" placeholder="City"><input id="state" required autocomplete="address-level1" placeholder="State"></div>
      <input id="postalCode" required autocomplete="postal-code" inputmode="numeric" placeholder="Postal code">
      <select id="payment" aria-label="Payment method"><option value="cod">Cash on Delivery</option><option value="online">Online Payment</option><option value="fampay">FaMPay</option></select>
      <button type="submit">PLACE ORDER</button>
    </form>
    <p><a class="back" href="/">← Continue shopping</a></p>
  </main>
  <script src="/assets/js/checkout.js" defer></script>
</body>
</html>
